    <circle cx="16" cy="16" r="7.5" stroke-opacity="0.22" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="3.5" stroke-opacity="0.22" stroke-width="1"/>
    <!-- crosshair -->
    <line x1="4.5" y1="16" x2="27.5" y2="16" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="16" y1="4.5" x2="16" y2="27.5" stroke-opacity="0.18" stroke-width="1"/>
  </g>
  <!-- center -->
