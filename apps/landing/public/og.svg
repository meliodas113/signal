<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="82%" cy="8%" r="60%">
      <stop offset="0%" stop-color="#c2f53f" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#c2f53f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scope" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c2f53f" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#c2f53f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0d0e"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- radar motif, right side -->
  <g transform="translate(930,315)">
    <circle r="250" fill="url(#scope)"/>
    <circle r="250" fill="none" stroke="#c2f53f" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle r="175" fill="none" stroke="#c2f53f" stroke-opacity="0.13" stroke-width="1.5"/>
    <circle r="100" fill="none" stroke="#c2f53f" stroke-opacity="0.13" stroke-width="1.5"/>
    <circle r="35"  fill="none" stroke="#c2f53f" stroke-opacity="0.13" stroke-width="1.5"/>
    <line x1="-250" y1="0" x2="250" y2="0" stroke="#c2f53f" stroke-opacity="0.10"/>
    <line x1="0" y1="-250" x2="0" y2="250" stroke="#c2f53f" stroke-opacity="0.10"/>
    <path d="M0 0 L0 -250 A250 250 0 0 1 230 -98 Z" fill="#c2f53f" fill-opacity="0.12"/>
    <circle cx="120" cy="-70" r="9" fill="#c2f53f"/>
    <circle cx="-80" cy="60" r="7" fill="#c2f53f"/>
    <circle cx="60" cy="120" r="6" fill="#c2f53f"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(90,118)">
    <circle cx="22" cy="20" r="22" fill="none" stroke="#c2f53f" stroke-width="2"/>
    <path d="M22 20 L22 -2 A22 22 0 0 1 41 11 Z" fill="#c2f53f" fill-opacity="0.5"/>
    <circle cx="22" cy="20" r="3" fill="#c2f53f"/>
    <text x="62" y="30" font-family="Archivo, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="8" fill="#e9f0ea">SIGNAL</text>
    <text x="64" y="52" font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="6" fill="#8a9a93">SBIR / STTR RADAR</text>
  </g>

  <!-- headline -->
  <text x="90" y="320" font-family="Archivo, Arial, sans-serif" font-size="68" font-weight="800" fill="#e9f0ea">The right SBIR topics,</text>
  <text x="90" y="396" font-family="Archivo, Arial, sans-serif" font-size="68" font-weight="800" fill="#e9f0ea"><tspan fill="#c2f53f">before</tspan> the deadline.</text>

  <text x="92" y="470" font-family="Archivo, Arial, sans-serif" font-size="26" fill="#8a9a93">AI-matched, scored federal funding — equity-free.</text>

  <text x="90" y="560" font-family="'JetBrains Mono', monospace" font-size="20" letter-spacing="2" fill="#c2f53f">getsignal.co.in</text>
</svg>
